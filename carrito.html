<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Carrito</title>
    <link rel="icon" type="image/x-icon" href="./imagen/faviconlog64.ico">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!--iconsBootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">


    <link href="./css/estilos.css" rel="stylesheet">
    <link href="./css/index.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxygen:wght@300;400;700&display=swap" rel="stylesheet">
    <!--Oxygen instalada-->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet"><!--Raleway instalada-->


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap"
        rel="stylesheet">
    <!-- crimson instalada -->
</head>

<body>
    <!-- Barra nav -->
    <main class="container" id="navbar">

    </main>
    <!-- Fin barra nav -->

    <!-- Carrito -->





    <!-- Resumen -->
    <div class="row" style="width: 100%; padding-top: 100px;">
        <div class="col-md-6 order-md-2 mb-4">
            <h4 class="d-flex justify-content-between align-items-center mb-3">
                <span class="text-muted">Resumen</span>
                <span class="badge rounded-pill text-bg-danger" id="contadorProductos">0</span>
            </h4>
            <ul class="list-group mb-3">
                <li class="list-group-item d-flex justify-content-between lh-condensed">
                    <div>
                        <h5 class="my-0" id="totalProductos">Total en Productos</h5>
                    </div>
                    <span class="text-muted" id="productosTotal">0</span>
                </li>
                <li class="list-group-item d-flex justify-content-between lh-condensed">
                    <div>
                        <h5 class="my-0" id="totalPrecio">Total</h5>
                    </div>
                    <span class="text-muted" id="precioTotal">$0</span>
                </li>
            </ul>
        </div>
    </div>
    <!-- termina resumen -->

    <!-- boton pagar -->
    <div class="row">
        <div class="col-auto">
            <button style="" class="btn btn-primary" type="submit">Pagar</button>
        </div>
    </div>
    <!-- termina boton pagar -->


    </div>
    </div>
</div>


    <!-- Termina Carrito -->


    <!-- FOOTER  -->
    <div id="footer" class="login">

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
        crossorigin="anonymous"></script>

    <script src="./js/main.js"></script>
    <script src="./js/carrito.js"></script>

    <script>
        // Espera a que main.js termine de insertar el contenido
        window.addEventListener('load', function () {
            var popoverTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="popover"]'));
            popoverTriggerList.map(function (popoverTriggerEl) {
                return new bootstrap.Popover(popoverTriggerEl);
            });
        });
    </script>

</body>

</html>
