    <link href="https://fonts.googleapis.com/css2?family=Oxygen:wght@300;400;700&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet"><!--Raleway instalada-->


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap"
        rel="stylesheet">
    <!-- crimson instalada -->

    <!--botón flotante-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

<body>

    <!-- Barra nav -->
    <main class="container" id="navbar">
    </main>
    <!-- Fin barra nav -->

    <main class="container">
        <div class="form-content">
            <h1 id="title">Inicio de sesión</h1>
            <div id="alertContainer"></div>
            <form id="form">
                <div class="input-group">
                    <div class="input-field">
                        <i class="fa-solid fa-envelope" style="color:#B4C292"></i>

                        <input type="email" id="email" placeholder="Correo" autocomplete="off" name="user_mail">
                    </div>
                    <div class="input-field">
                        <i class="fa-solid fa-lock" style="color:#B4C292"></i>
                        <input type="password" id="password" placeholder="Contraseña">
                    </div>
                    <div class="btn-field">
                        <button id="signIn" type="submit">Login</button>

                    </div>
            </form>
        </div>
    </main>



    <!-- FOOTER  -->
    <div id="footer">

    </div>
    <!--Fin del Footer-->


<!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<!-- Plugin jQuery disableAutoFill -->
<script src="https://terrylinooo.github.io/jquery.disableAutoFill/dist/jquery.disableautofill.min.js"></script>
    <!--inicializa el plugging-->
    <script>
    $(document).ready(function() {
        $('#form').disableAutoFill({
            randomizeInputName: true,  // Cambia los nombres de los campos para evitar autofill
            callback: function() {
                console.log("Autofill desactivado.");}
            
             });
    });
    </script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"

        display: flex; align-items: center; justify-content: center; font-size: 24px;">
        <i class="bi-cart"></i>

    </a>
</body>
