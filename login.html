<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de sesión</title>
  <link rel="icon" type="image/x-icon" href="./imagen/faviconlog64.ico">
  <link rel="stylesheet" href="./css/login.css">
  <script src="https://kit.fontawesome.com/529df2aa81.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!--iconsBootstrap-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">

  <link href="./css/estilos.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oxygen:wght@300;400;700&display=swap" rel="stylesheet">
  <!--Oxygen instalada-->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet"><!--Raleway instalada-->


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap"
    rel="stylesheet">
  <!-- crimson instalada -->

  <!--botón flotante-->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body>

  <!-- Barra nav -->
  <div id="navbar">
  </div>
  <!-- Fin barra nav -->

  <main class="login-container" style="padding: 10%; display: block; height: max-content; padding-top: 5%;">
    <h1 class="text-center mb-4">Inicio de sesión</h1>
    <div id="alertContainer"></div>

    <form id="form" class="mx-auto" style="max-width: 600px;">
      <!-- Correo -->
      <div class="mb-3" style="object-fit: contain; height: max-content; padding-top: 20px;">
        <label for="email" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="email" placeholder="Ej. ejemplo@correo.com">
      </div>

      <!-- Contraseña -->
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" placeholder="Ingresa tu contraseña">
      </div>

      <!-- Botón enviar -->
      <div class="text-center mt-4">
        <button id="signIn" type="submit" class="btn btn-primary">Iniciar Sesión</button>
      </div>
    </form>

    <!--Botón secundario-->
    <div class="text-center mt-4">
      <a href="./formRegistro.html" class="btn active">Crear Cuenta</a>
    </div>

    <!-- Botón flotante -->
    <a href="formulario.html" class="btn btn-primary rounded-circle position-fixed shadow" style="top: 50%; right: 20px; transform: translateY(-50%);
      width: 60px; height: 60px;
      display: flex; align-items: center; justify-content: center; font-size: 24px;">
      <i class="bi-cart"></i>
    </a>
  </main>




  <!-- FOOTER  -->
  <div id="footer">

  </div>
  <!--Fin del Footer-->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
    crossorigin="anonymous"></script>
  <script src="./js/main.js"></script>
  <script src="./js/login.js"></script>
</body>

</html>
